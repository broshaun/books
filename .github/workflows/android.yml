name: Tauri2 Android Build Split APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            rust_target: aarch64-linux-android
            name: arm64-v8a

          - abi: armv7
            rust_target: armv7-linux-androideabi
            name: armeabi-v7a

          - abi: i686
            rust_target: i686-linux-android
            name: x86

          - abi: x86_64
            rust_target: x86_64-linux-android
            name: x86_64

    env:
      NODE_VERSION: "20"
      JAVA_VERSION: "17"
      NDK_VER: "26.1.10909125"
      BUILD_TOOLS_VER: "34.0.0"
      ANDROID_PLATFORM: "34"
      WORKING_DIR: "app"

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Java
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # Rust
      # ============================================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # ============================================================
      # Android SDK
      #
      # packages: "" 避免安装已经废弃的 tools package
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # Android SDK / Build Tools / NDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VER}" \
            "ndk;${NDK_VER}"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VER}"

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: NDK not found at:"
            echo "$NDK_PATH"
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo \
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            >> "$GITHUB_PATH"

          echo "Android SDK ready."
          echo "NDK_PATH=$NDK_PATH"

      # ============================================================
      # Node
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ============================================================
      # pnpm
      # ============================================================
      - name: Enable Corepack and activate pnpm
        shell: bash
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.12.3 --activate
          node --version
          pnpm --version

      # ============================================================
      # Frontend dependencies
      # ============================================================
      - name: Install frontend dependencies
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euxo pipefail
          pnpm config set registry https://registry.npmmirror.com
          pnpm install --no-frozen-lockfile
          pnpm tauri --version

      # ============================================================
      # Clean + Initialize Android
      # ============================================================
      - name: Clean and initialize Android project
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euxo pipefail
          rm -rf src-tauri/gen/android || true
          pnpm tauri android init --ci

      # ============================================================
      # Build one ABI
      # ============================================================
      - name: Build Android APK - ${{ matrix.name }}
        shell: bash
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          set -euxo pipefail

          echo "Building ABI: ${{ matrix.name }}"
          echo "Rust target: ${{ matrix.rust_target }}"

          pnpm tauri android build \
            --apk \
            --target ${{ matrix.abi }}

      # ============================================================
      # Find generated APK
      # ============================================================
      - name: Find release APK
        id: apk
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_DIR="${{ env.WORKING_DIR }}/src-tauri/gen/android"

          echo "Generated APK files:"

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          APK_SRC=$(
            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              | grep -i "release" \
              | head -n 1 \
              || true
          )

          if [ -z "$APK_SRC" ]; then
            APK_SRC=$(
              find "$ANDROID_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1 \
                || true
            )
          fi

          if [ -z "$APK_SRC" ]; then
            echo "ERROR: APK NOT FOUND"

            find "$ANDROID_DIR" \
              -type f \
              | sed -n '1,300p' \
              || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK_SRC"

          echo "apk_path=$APK_SRC" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Sign APK
      # ============================================================
      - name: Sign APK - ${{ matrix.name }}
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euxo pipefail

          mkdir -p dist

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 is empty"
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty"
            exit 1
          fi

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEY_PASSWORD is empty"
            exit 1
          fi

          # Restore keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > /tmp/release.jks

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VER}"

          UNSIGNED_APK="${{ steps.apk.outputs.apk_path }}"

          SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')

          SIGNED_APK="dist/app-${SAFE_REF}-${{ matrix.name }}.apk"

          echo "Unsigned APK:"
          echo "$UNSIGNED_APK"

          echo "Signed APK:"
          echo "$SIGNED_APK"

          # Zipalign
          "$BT/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            /tmp/aligned.apk

          # Sign
          "$BT/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            /tmp/aligned.apk

          # Verify
          "$BT/apksigner" verify \
            --verbose \
            "$SIGNED_APK"

          echo "Signed APK:"
          ls -lh "$SIGNED_APK"

          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

          rm -f /tmp/release.jks
          rm -f /tmp/aligned.apk

      # ============================================================
      # Upload APK
      # ============================================================
      - name: Upload APK artifact - ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: app-android-${{ matrix.name }}
          path: ${{ steps.sign.outputs.signed_apk }}
          if-no-files-found: error
          retention-days: 14

  # ==============================================================
  # RELEASE
  #
  # 等四个 ABI 全部成功后统一发布
  # ==============================================================
  release:
    name: Create GitHub Release
    needs: android
    runs-on: ubuntu-latest

    # 手动运行 workflow 只生成 Artifact
    # android-v* tag 才创建 Release
    if: startsWith(github.ref, 'refs/tags/android-v')

    steps:
      # ============================================================
      # Download all APKs
      # ============================================================
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: app-android-*
          path: release-apks
          merge-multiple: true

      # ============================================================
      # Check APKs
      # ============================================================
      - name: Verify APK files
        shell: bash
        run: |
          set -euxo pipefail

          echo "APK files:"

          find release-apks \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(
            find release-apks \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -ne 4 ]; then
            echo "ERROR: Expected 4 APK files, found $APK_COUNT"
            exit 1
          fi

      # ============================================================
      # GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}